# Build the documentation site in docs/ and publish it to GitHub Pages.
#
# Pull requests that touch docs/ are built but never deployed. A push to main
# that touches docs/, or a manual run on main, builds and deploys.
#
# One-time repository setup: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "src/templates/**"
      - "tools/templates.mjs"
      - "tools/build.mjs"
      - "tools/fixtures/**"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "src/templates/**"
      - "tools/templates.mjs"
      - "tools/build.mjs"
      - "tools/fixtures/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One docs run per ref. A newer commit cancels an obsolete capture/build so
# pull requests cannot be blocked behind screenshots from an older HEAD.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install (lockfile only)
        run: npm ci

      - name: Capture all selectable template previews
        run: npm run previews

      - name: Verify preview manifest
        run: |
          node -e "const m=require('./public/previews/manifest.json'); if(m.total!==60||m.uniqueHashes!==60) throw new Error('expected 60 unique captures'); console.log(m.total, 'previews OK')"

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
