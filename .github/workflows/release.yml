name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install validation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-jinja2 shellcheck

      - name: Require tag to match VERSION
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          test "${GITHUB_REF_NAME}" = "${expected}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${expected})"
            exit 1
          }

      - name: Release validation
        run: |
          npm test
          npm run verify
          npm run lint:sh
          npm run build:panels

      - name: Build deterministic release assets
        run: |
          rm -rf release
          tools/make-release.sh release

      - name: Verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          artifact="row-template-${version}.tar.gz"
          test -s "release/install.sh"
          test -s "release/manifest.txt"
          test -s "release/SHA256SUMS"
          test -s "release/${artifact}"
          grep -Fx "version=${version}" release/manifest.txt
          (
            cd release
            sha256sum -c SHA256SUMS
          )
          tar -tzf "release/${artifact}" >/dev/null

      - name: Write release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Gold-Template's first independent stable release.

          Highlights:
          - 30 selectable designs: 17 frozen upstream core templates + 13 GoldApp custom templates.
          - GoldApp preset and recommended `gold-template` CLI with `row-template` compatibility.
          - Smart Renewal treatment in the Gold design.
          - 3X-UI, PasarGuard and Rebecca release payloads.
          - Mandatory SHA-256 verification and transactional install/update/rollback.
          - English, Persian and Arabic documentation with deterministic preview generation.

          The release assets are built from this tag only after the full test, verification,
          ShellCheck and panel-build gates pass.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            "release/install.sh" \
            "release/manifest.txt" \
            "release/SHA256SUMS" \
            "release/row-template-${version}.tar.gz" \
            --verify-tag \
            --latest \
            --title "Gold-Template ${version}" \
            --notes-file /tmp/release-notes.md
